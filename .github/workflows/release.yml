name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -ldflags="-s -w" -o kuberoute-${{ matrix.suffix }}${{ matrix.ext }} .

    - name: Package (non-Windows)
      if: matrix.goos != 'windows'
      run: |
        tar -czf kuberoute-${{ matrix.suffix }}.tar.gz kuberoute-${{ matrix.suffix }}
        echo "artifact=kuberoute-${{ matrix.suffix }}.tar.gz" >> $GITHUB_ENV

    - name: Package (Windows)
      if: matrix.goos == 'windows'
      run: |
        zip kuberoute-${{ matrix.suffix }}.zip kuberoute-${{ matrix.suffix }}.exe
        echo "artifact=kuberoute-${{ matrix.suffix }}.zip" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kuberoute-${{ matrix.suffix }}
        path: ${{ env.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
